<!doctype html><meta charset="utf-8"><script src="../app/vendor/tesseract/tesseract.min.js"></script>
<script>
async function prep(blob, target) {
  const img = await createImageBitmap(blob); let k = Math.min(3, Math.max(1, target / img.width));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data, hist = new Uint32Array(256);
  for (let i = 0; i < p.length; i += 4) { const g = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 | 0; p[i] = g; hist[g]++; }
  const total = p.length / 4; let lo = 0, hi = 255, acc = 0;
  for (; lo < 254; lo++) { acc += hist[lo]; if (acc > total * .01) break; } acc = 0; for (; hi > lo + 1; hi--) { acc += hist[hi]; if (acc > total * .01) break; }
  let sum = 0; for (let i = 0; i < p.length; i += 4) { const v = (p[i] - lo) * 255 / Math.max(1, hi - lo); p[i] = v < 0 ? 0 : v > 255 ? 255 : v; sum += p[i]; }
  const m = sum / total; for (let i = 0; i < p.length; i += 4) { let v = (p[i] - m) * 1.6 + m; v = v < 0 ? 0 : v > 255 ? 255 : v; p[i] = p[i + 1] = p[i + 2] = v; }
  x.putImageData(d, 0, 0); return c;
}
window.bench = async (url, targets) => {
  const base = new URL('../app/vendor/tesseract/', location.href).href; const out = {};

  out.load = Math.round(performance.now() - t);
  const blob = await (await fetch(url)).blob();
  for (const tg of targets) {
    t = performance.now(); const c = await prep(blob, tg); const tp = performance.now() - t;
    t = performance.now(); const { data } = await w.recognize(c); const tr = performance.now() - t;
    out['w' + tg] = { size: c.width + 'x' + c.height, prep: Math.round(tp), read: Math.round(tr), rows: (data.text.match(/^(FIRST|SECOND)/gim) || []).length, nums: (data.text.match(/\b(1[12]\d|2[12]\d)\b/g) || []).length };
  }
  return out;
};
